<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#141445" />
<title>Aventuri 2026 · AMCh</title>
<meta name="description" content="Aventuri 2026 — Clubes de Aventureros de la Asociación Metropolitana de Chile. Revisa el programa." />

<!-- Favicon: brújula dorada sobre índigo (tema aventura) -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23141445'/><path d='M16 5l2.3 8.1L26 16l-7.7 2.9L16 27l-2.3-8.1L6 16l7.7-2.9z' fill='%23FFC83D'/></svg>" />

<!-- Tipografías: Fredoka (título/botón, amable y redondeada) + Inter (texto). Livianas para escaneo rápido del QR. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  :root{
    --indigo-900:#10103a;
    --indigo-700:#242463;
    --blue-stone:#3f5ec0;
    --leaf:#5f9a30;
    --leaf-bright:#8cc63f;
    --lime:#bce453;
    --gold:#ffc83d;
    --gold-deep:#f5a623;
    --cream:#f6f4ea;
    --cream-dim:#cdd4bb;
    --radius:18px;
    --maxw:460px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ -webkit-text-size-adjust:100%; }

  body{
    min-height:100vh;
    min-height:100dvh;
    font-family:"Inter", system-ui, -apple-system, sans-serif;
    color:var(--cream);
    line-height:1.5;
    position:relative;
    overflow-x:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:clamp(28px,7vh,64px) 22px;
    padding-bottom:calc(clamp(28px,7vh,64px) + env(safe-area-inset-bottom));
  }

  /* ---------- Fondo responsive: vertical en móvil, horizontal en pantallas anchas ---------- */
  .bg{
    position:fixed; inset:0; z-index:0;
    background-image:url('fondo_aventuri2.jpg');   /* vertical (1440x2560) por defecto */
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }
  @media (orientation:landscape){
    .bg{ background-image:url('fondo_aventuri.jpg'); }  /* horizontal (2560x1440) */
  }

  /* Velo para asegurar contraste del texto y el botón sobre la foto */
  .overlay{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(130% 85% at 50% 40%, rgba(8,8,32,.08), rgba(8,8,32,.62) 100%),
      linear-gradient(to bottom, rgba(8,8,32,.42) 0%, rgba(8,8,32,.12) 38%, rgba(8,8,32,.58) 100%);
  }

  /* Luciérnagas (canvas liviano) */
  #fireflies{ position:fixed; inset:0; z-index:2; pointer-events:none; }

  /* ---------- Contenido ---------- */
  main{
    position:relative; z-index:3;
    width:100%; max-width:var(--maxw);
    display:flex; flex-direction:column; align-items:center;
    text-align:center;
  }

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  .logo{
    width:clamp(200px, 66vw, 320px);
    height:auto;
    filter:drop-shadow(0 8px 28px rgba(0,0,0,.5));
  }

  .tagline{
    margin-top:1.5rem;
    font-family:"Fredoka", system-ui, sans-serif;
    font-weight:600;
    font-size:clamp(1.05rem, 4.6vw, 1.3rem);
    letter-spacing:.2px;
    text-wrap:balance;
    max-width:20ch;
    text-shadow:0 2px 16px rgba(0,0,0,.6);
  }
  .sub{
    margin-top:.5rem;
    display:flex; align-items:center; gap:.4rem;
    font-size:.9rem; font-weight:500;
    color:var(--cream-dim);
    text-shadow:0 1px 10px rgba(0,0,0,.6);
  }
  .sub svg{ opacity:.9; }

  /* ---------- Botón principal: "Ver programa" (el elemento protagonista) ---------- */
  .cta-wrap{ margin-top:2.3rem; width:100%; }

  .btn{
    position:relative; overflow:hidden;
    display:flex; align-items:center; gap:14px;
    width:100%; min-height:72px;
    padding:16px 22px;
    border-radius:var(--radius);
    text-decoration:none;
    font-family:"Fredoka", system-ui, sans-serif;
    font-weight:600; font-size:1.18rem; letter-spacing:.2px;
    color:#15153f;
    background:linear-gradient(135deg, #ffd766, var(--gold-deep) 78%);
    background-size:180% 180%;
    border:1px solid rgba(255,255,255,.4);
    box-shadow:0 16px 38px -12px rgba(245,166,35,.75);
    -webkit-tap-highlight-color:transparent;
    transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
    isolation:isolate;
    animation:rise .6s cubic-bezier(.2,.7,.2,1) .28s both, sheen 7s ease .6s infinite;
  }
  /* brillo que sigue al cursor (PC) */
  .btn::before{
    content:""; position:absolute; inset:0; z-index:-1;
    background:radial-gradient(180px circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,.35), transparent 60%);
    opacity:0; transition:opacity .25s ease;
  }
  .btn:hover::before{ opacity:1; }

  .btn .ico{
    flex:0 0 46px; width:46px; height:46px;
    display:grid; place-items:center; border-radius:14px;
    background:rgba(21,21,63,.14);
  }
  .btn .ico svg{ width:24px; height:24px; }
  .btn .txt{ flex:1; text-align:left; line-height:1.15; }
  .btn .chev{ flex:0 0 auto; opacity:.6; transition:transform .18s ease, opacity .18s ease; }

  .btn:hover, .btn:focus-visible{
    transform:translateY(-3px);
    box-shadow:0 22px 48px -12px rgba(245,166,35,.9);
    outline:none;
  }
  .btn:hover .chev, .btn:focus-visible .chev{ transform:translateX(4px); opacity:.95; }
  .btn:active{ transform:translateY(-1px) scale(.99); }
  .btn:focus-visible{ box-shadow:0 0 0 4px rgba(188,228,83,.7), 0 16px 38px -12px rgba(245,166,35,.75); }

  @keyframes sheen{ 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

  /* Ondas al tocar/click */
  .ripple{
    position:absolute; border-radius:50%;
    background:rgba(21,21,63,.22);
    transform:translate(-50%,-50%) scale(0);
    animation:rip .55s ease-out forwards;
    pointer-events:none; z-index:0;
  }
  @keyframes rip{ to{ transform:translate(-50%,-50%) scale(1); opacity:0; } }

  /* ---------- Pie: AMCh ---------- */
  footer{ margin-top:2.6rem; display:flex; flex-direction:column; align-items:center; gap:.9rem; }
  .social{ display:flex; gap:14px; }
  .social a{
    width:46px; height:46px; border-radius:50%;
    display:grid; place-items:center;
    color:var(--cream);
    background:rgba(16,16,58,.5);
    border:1px solid rgba(246,244,234,.22);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    transition:transform .18s ease, background .18s ease, border-color .18s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .social a:hover, .social a:focus-visible{
    transform:translateY(-2px);
    background:var(--leaf);
    border-color:rgba(255,255,255,.45);
    outline:none;
  }
  .social svg{ width:21px; height:21px; }

  .credit{
    display:flex; align-items:center; gap:.5rem;
    font-size:.78rem; color:var(--cream-dim); opacity:.9;
    text-decoration:none;
  }
  .credit:hover{ opacity:1; }

  /* ---------- Entrada escalonada ---------- */
  .reveal{ opacity:0; transform:translateY(16px); animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
  .d1{ animation-delay:.05s } .d2{ animation-delay:.16s } .d3{ animation-delay:.26s } .d4{ animation-delay:.46s }
  @keyframes rise{ to{ opacity:1; transform:none } }

  @media (prefers-reduced-motion:reduce){
    .reveal{ animation:none; opacity:1; transform:none; }
    .btn{ animation:none; }
    #fireflies{ display:none; }
  }
</style>
</head>
<body>

  <div class="bg" aria-hidden="true"></div>
  <div class="overlay" aria-hidden="true"></div>
  <canvas id="fireflies" aria-hidden="true"></canvas>

  <main>
    <h1 class="sr-only">Aventuri 2026 — Clubes de Aventureros, Asociación Metropolitana de Chile</h1>

    <!-- LOGO (si aún no está en el repo, no rompe el diseño) -->
    <img class="logo reveal d1" src="logo_aventuri.png" alt="Aventuri 2026"
         onerror="this.style.display='none'" />

    <!-- TEXTO (edítalo libremente) -->
    <p class="tagline reveal d2">El gran encuentro de los Clubes de Aventureros</p>
    <p class="sub reveal d2">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      Asociación Metropolitana de Chile
    </p>

    <!-- BOTÓN PRINCIPAL -->
    <!-- Cambia el href por el nombre del PDF que subas al repo (p. ej. programa_aventuri.pdf). -->
    <!-- Para forzar descarga en lugar de previsualizar, agrega el atributo  download  al <a>. -->
    <div class="cta-wrap">
      <a class="btn reveal d3" href="programa_aventuri.pdf" target="_blank" rel="noopener">
        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h4"/></svg>
        </span>
        <span class="txt">Ver programa</span>
        <span class="chev" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
      </a>
    </div>

    <footer class="reveal d4">
      <!-- Enlaces AMCh. (Cuando tengas los PNG de los logos, se pueden sumar aquí como <img>.) -->
      <div class="social">
        <a href="https://www.instagram.com/adventistasamch/" target="_blank" rel="noopener" aria-label="Instagram AMCh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.1" fill="currentColor" stroke="none"/></svg>
        </a>
        <a href="https://www.facebook.com/adventistasmetro" target="_blank" rel="noopener" aria-label="Facebook AMCh">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 9h3l.4-3H14V4.2c0-.9.3-1.5 1.6-1.5H17V.1C16.7 0 15.7 0 14.6 0 12.2 0 10.5 1.5 10.5 4v2H7.5v3h3v11H14Z"/></svg>
        </a>
        <a href="https://www.youtube.com/@AdventistasAMCh" target="_blank" rel="noopener" aria-label="YouTube AMCh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 8.2a3 3 0 0 0-2.1-2.1C18 5.6 12 5.6 12 5.6s-6 0-7.9.5A3 3 0 0 0 2 8.2 31 31 0 0 0 1.6 12 31 31 0 0 0 2 15.8a3 3 0 0 0 2.1 2.1c1.9.5 7.9.5 7.9.5s6 0 7.9-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 22.4 12 31 31 0 0 0 22 8.2Z"/><path d="m10 15 5-3-5-3Z" fill="currentColor"/></svg>
        </a>
      </div>
      <a class="credit" href="https://www.adventistasamch.cl" target="_blank" rel="noopener">Adventistas AMCh</a>
    </footer>
  </main>

<script>
(function(){
  "use strict";
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Ondas al tocar + brillo que sigue al cursor ---------- */
  var canHover = window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches;
  document.querySelectorAll('.btn').forEach(function(btn){
    btn.addEventListener('pointerdown', function(e){
      var r = btn.getBoundingClientRect();
      var size = Math.max(r.width, r.height) * 2;
      var s = document.createElement('span');
      s.className = 'ripple';
      s.style.width = s.style.height = size + 'px';
      s.style.left = (e.clientX - r.left) + 'px';
      s.style.top  = (e.clientY - r.top)  + 'px';
      btn.appendChild(s);
      s.addEventListener('animationend', function(){ s.remove(); });
    });
    if (canHover){
      btn.addEventListener('pointermove', function(e){
        var r = btn.getBoundingClientRect();
        btn.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        btn.style.setProperty('--my', (e.clientY - r.top)  + 'px');
      });
    }
  });

  /* ---------- Luciérnagas flotantes (canvas liviano) ---------- */
  if (reduce) return;
  var canvas = document.getElementById('fireflies');
  var ctx = canvas.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W, H, parts, raf, running = true;
  var COUNT = matchMedia('(max-width: 600px)').matches ? 16 : 30;

  function size(){
    W = canvas.clientWidth = window.innerWidth;
    H = canvas.clientHeight = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function mote(){
    return {
      x: Math.random()*W,
      y: Math.random()*H,
      r: 1 + Math.random()*2,
      sp: 0.12 + Math.random()*0.35,          // deriva suave hacia arriba
      sway: 0.6 + Math.random()*1.2,           // amplitud del vaivén
      phase: Math.random()*Math.PI*2,
      tw: 0.6 + Math.random()*1.4,             // velocidad de parpadeo
      base: 0.25 + Math.random()*0.45,
      hue: Math.random() < 0.45 ? 80 : 45      // mezcla verde-lima y dorado
    };
  }
  function init(){ size(); parts = []; for (var i=0;i<COUNT;i++){ parts.push(mote()); } }
  var t = 0;
  function frame(){
    if (!running) return;
    t += 0.016;
    ctx.clearRect(0,0,W,H);
    for (var i=0;i<parts.length;i++){
      var p = parts[i];
      p.y -= p.sp;
      p.phase += 0.01;
      var x = p.x + Math.sin(t*p.tw + p.phase) * p.sway;
      if (p.y < -12){ parts[i] = mote(); parts[i].y = H + 12; continue; }
      var a = p.base * (0.55 + 0.45*Math.sin(t*p.tw*1.6 + p.phase)); // parpadeo
      var g = ctx.createRadialGradient(x,p.y,0,x,p.y,p.r*5);
      g.addColorStop(0, 'hsla('+p.hue+',90%,65%,'+a+')');
      g.addColorStop(1, 'hsla('+p.hue+',90%,55%,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x,p.y,p.r*5,0,Math.PI*2);
      ctx.fill();
    }
    raf = requestAnimationFrame(frame);
  }
  init();
  frame();

  var rt;
  window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(init, 200); });
  document.addEventListener('visibilitychange', function(){
    running = !document.hidden;
    if (running){ frame(); } else { cancelAnimationFrame(raf); }
  });
})();
</script>
</body>
</html>
